<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QH Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <form id="key-form" hidden>
    <h1>Nhập MapTiler API key</h1>
    <p>Lấy key miễn phí tại <a href="https://cloud.maptiler.com/account/keys/" target="_blank" rel="noopener">cloud.maptiler.com</a>. Key được lưu trong trình duyệt này.</p>
    <input name="key" placeholder="API key" required autocomplete="off">
    <button type="submit">Mở bản đồ</button>
  </form>

  <button id="layer-switch" class="layer-switch" type="button" aria-pressed="false">
    <span class="thumb"></span>
    <span class="label">Vệ tinh</span>
  </button>

  <div class="traffic-card">
    <label class="traffic-toggle">
      <span>Giao thông</span>
      <input id="traffic-toggle" type="checkbox" checked>
      <span class="switch" aria-hidden="true"></span>
    </label>
    <div class="traffic-legend">
      <span>Nhanh</span>
      <span class="bar"><i style="--c:#1e9e47"></i><i style="--c:#6cc644"></i><i style="--c:#f5c518"></i><i style="--c:#f2711c"></i><i style="--c:#d93025"></i></span>
      <span>Chậm</span>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
